<div class="row">
  <h6 class="h6">EDUCATION</h6><hr />
  <div class="col-xl-12">

    @for (education of educations; track $index) {

      <div>
        <p>
          <span class="fw-bold text-dark">{{ education.degree }}</span> |
          <span class="fw-bolder"><a [href]="education.institution_url" target="_blank">{{ education.institution }}</a></span> ({{ education.graduation_year }})
        </p>
      </div>
    }

  </div>
</div>
